apiVersion: v1
kind: ServiceAccount
metadata:
  name: sglang-sa
  namespace: default
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: distributed-sglang-nvfp4-k26
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: distributed-sglang-nvfp4-k26
  serviceName: "sglang-master-pod-nvfp4-k26"
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: distributed-sglang-nvfp4-k26
      annotations:
        networking.gke.io/default-interface: 'eth0'
        networking.gke.io/interfaces: |
          [
            {"interfaceName":"eth0","network":"default"},
            {"interfaceName":"eth2","network":"rdma-0"},
            {"interfaceName":"eth3","network":"rdma-1"},
            {"interfaceName":"eth4","network":"rdma-2"},
            {"interfaceName":"eth5","network":"rdma-3"},
            {"interfaceName":"eth6","network":"rdma-4"},
            {"interfaceName":"eth7","network":"rdma-5"},
            {"interfaceName":"eth8","network":"rdma-6"},
            {"interfaceName":"eth9","network":"rdma-7"}
          ]
    spec:
      serviceAccountName: sglang-sa
      initContainers:
      - name: clean-boot-disk
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
          - |
            rm -rf /host-var-lib/huggingface_cache || true
            rm -rf /host-var-lib/kubelet/huggingface_cache || true
            echo "Cleaned up old boot disk caches!"
        volumeMounts:
          - name: host-var-lib
            mountPath: /host-var-lib
      - name: nccl-plugin-installer
        imagePullPolicy: Always
        image: "us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib:v1.1.2"
        volumeMounts:
        - name: gib-nccl-plugin-volume
          mountPath: /target/usr/local/gib
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -ex
          /scripts/container_entry.sh install --install-nccl
          cp -R /var/lib/gib/. /target/usr/local/gib
      - name: pull-model-from-gcs
        image: google/cloud-sdk:slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -ex
            mkdir -p /root/.cache/huggingface/Kimi-K2.6-NVFP4
            find /root/.cache/huggingface/Kimi-K2.6-NVFP4/ -size 0 -delete || true
            rm -f /root/.cache/huggingface/Kimi-K2.6-NVFP4/*.gstmp || true
            echo "Running fast GCS rsync for Kimi-K2.6-NVFP4..."
            gcloud storage rsync -r gs://ikwak-models-gpu-launchpad-playground/Kimi-K2.6-NVFP4 /root/.cache/huggingface/Kimi-K2.6-NVFP4/
            echo "Model rsync complete!"
        volumeMounts:
          - name: hf-cache
            mountPath: /root/.cache/huggingface
      containers:
      - name: sglang-container
        image: docker.io/lmsysorg/sglang:v0.5.10.post1
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - |
          set -ex
          ldconfig /usr/local/nvidia/lib64/ || true
          export LD_LIBRARY_PATH="/usr/local/gib/lib64:/usr/local/nvidia/lib64:$LD_LIBRARY_PATH"
          if [ -f "/usr/local/gib/scripts/set_nccl_env.sh" ]; then
              source /usr/local/gib/scripts/set_nccl_env.sh
          fi

          pip install -q accelerate
          python3 -c "
          path = '/usr/local/lib/python3.12/dist-packages/flashinfer/prefill.py'
          with open(path, 'r') as f: c = f.read()
          old = '            if q.size(0) != self._qo_indptr_last:\n                raise ValueError('
          new = '            if q.size(0) > self._qo_indptr_last:\n                q = q[:self._qo_indptr_last]\n            elif q.size(0) != self._qo_indptr_last:\n                raise ValueError('
          if old in c:
              c = c.replace(old, new)
              with open(path, 'w') as f: f.write(c)
              print('Successfully patched flashinfer/prefill.py for DP-Attention ragged prefill!')
          "

          python3 -m sglang.launch_server \
              --model-path /root/.cache/huggingface/Kimi-K2.6-NVFP4 \
              --served-model-name nvidia/Kimi-K2.6-NVFP4 \
              --trust-remote-code \
              --quantization modelopt_fp4 \
              --disable-shared-experts-fusion \
              --mem-fraction-static 0.78 \
              --chunked-prefill-size 16384 \
              --enable-mixed-chunk \
              --context-length 131072 \
              --max-running-requests 128 \
              --cuda-graph-max-bs 128 \
              --nnodes 2 \
              --node-rank $POD_INDEX \
              --dist-init-addr sglang-master-pod-nvfp4-k26:5000 \
              --enable-fused-moe-sum-all-reduce \
              --reasoning-parser kimi_k2 \
              --tool-call-parser kimi_k2 \
              --kv-cache-dtype fp8_e4m3 \
              --speculative-algorithm EAGLE3 \
              --speculative-draft-model-path lightseekorg/kimi-k2.5-eagle3 \
              --speculative-num-steps 3 \
              --speculative-eagle-topk 1 \
              --speculative-num-draft-tokens 4 \
              --speculative-draft-model-quantization unquant \
              --enable-hierarchical-cache \
              --hicache-ratio 2.0 \
              --hicache-write-policy write_through_selective \
              --schedule-policy lpm \
              --schedule-conservativeness 0.3 \
              --fp4-gemm-backend flashinfer_cutlass \
              --attention-backend flashinfer \
              --prefill-attention-backend triton \
              --moe-runner-backend flashinfer_cutlass \
              --enable-flashinfer-allreduce-fusion \
              --disable-custom-all-reduce \
              --tp-size 8 \
              --pp-size 1 \
              --dp-size 2 \
              --enable-dp-attention \
              --flashinfer-mla-disable-ragged \
              --watchdog-timeout 36000 \
              --host 0.0.0.0 \
              --port 8000
        env:
        - name: POD_INDEX
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
              optional: true
        - name: NCCL_DEBUG
          value: WARN
        - name: SGLANG_REQUEST_STATE_WAIT_TIMEOUT
          value: "18000"
        - name: SGLANG_ENABLE_SPEC_V2
          value: "1"
        - name: OMP_NUM_THREADS
          value: "24"
        - name: SGLANG_SET_CPU_AFFINITY
          value: "1"
        - name: SAFETENSORS_FAST_GPU
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: SGLANG_ENABLE_DEEP_GEMM
          value: "0"
        - name: SGLANG_ENABLE_JIT_DEEPGEMM
          value: "0"
        resources:
          limits:
            nvidia.com/gpu: "8"
            cpu: "206"
            memory: "1500Gi"
          requests:
            nvidia.com/gpu: "8"
            cpu: "206"
            memory: "1500Gi"
        volumeMounts:
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /root/.cache/huggingface
            name: hf-cache
          - name: nvidia-install-dir-host
            mountPath: /usr/local/nvidia
          - name: gib-nccl-plugin-volume
            mountPath: /usr/local/gib
        securityContext:
          privileged: true  
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-b200
      tolerations:
        - operator: "Exists"
          key: "nvidia.com/gpu"
        - operator: "Exists"
          key: "cloud.google.com/impending-node-termination"
        - operator: "Exists"
          key: "user-workload"
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 100Gi
        name: dshm
      - name: hf-cache
        hostPath:
          path: /mnt/stateful_partition/kube-ephemeral-ssd/huggingface_cache
          type: DirectoryOrCreate
      - name: nvidia-install-dir-host
        hostPath:
          path: /home/kubernetes/bin/nvidia
      - name: gib-nccl-plugin-volume
        emptyDir: {}
      - name: host-var-lib
        hostPath:
          path: /var/lib
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-master-pod-nvfp4-k26
  namespace: default
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: distributed-sglang-nvfp4-k26
    apps.kubernetes.io/pod-index: "0"
  ports:
  - name: dist-port
    port: 5000
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-serving-nvfp4-k26
  namespace: default
spec:
  type: NodePort
  selector:
    app: distributed-sglang-nvfp4-k26
    apps.kubernetes.io/pod-index: "0"
  ports:
  - name: serving
    port: 8000
    targetPort: 8000
  - name: metrics
    port: 8080
    targetPort: 8080
