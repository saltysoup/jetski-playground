# GKE Inference Gateway (llm-d) configuration for SGLang Kimi K2.6 NVFP4
# CRITICAL: Uses gke-l7-rilb (Regional Internal Application Load Balancer) per GCP Org Policies
# Compatible with both 1-node (sglang-nvfp4-k26-1node) and 2-node (distributed-sglang-nvfp4-k26) deployments
# via llm-d.ai/guide: optimized-baseline pod label matching.

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sglang-inference-gateway
  namespace: default
  labels:
    app: sglang-inference-gateway
spec:
  gatewayClassName: gke-l7-rilb
  listeners:
    - protocol: HTTP
      port: 80
      name: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sglang-inference-route
  namespace: default
  labels:
    app: sglang-inference-gateway
spec:
  parentRefs:
    - name: sglang-inference-gateway
  rules:
    # Route LLM inference endpoints through llm-d InferencePool (KV-cache-aware routing via EPP)
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: sglang-gateway
          group: "inference.networking.k8s.io"
          kind: InferencePool
    # Route administrative and benchmark endpoints (/server_info, /flush_cache, /health) directly to SGLang service
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sglang-serving-nvfp4-k26
          port: 8000
---
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferenceObjective
metadata:
  name: kimi-k26-objective
  namespace: default
  labels:
    app: sglang-inference-gateway
spec:
  priority: 10
  poolRef:
    name: sglang-gateway
    group: "inference.networking.k8s.io"
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: sglang-service-timeout-policy
  namespace: default
spec:
  default:
    timeoutSec: 3600
  targetRef:
    group: ""
    kind: Service
    name: sglang-serving-nvfp4-k26
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: sglang-gateway-timeout-policy
  namespace: default
spec:
  default:
    timeoutSec: 3600
  targetRef:
    group: "inference.networking.k8s.io"
    kind: InferencePool
    name: sglang-gateway
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: sglang-healthcheck-policy
  namespace: default
spec:
  default:
    checkIntervalSec: 30
    timeoutSec: 30
    unhealthyThreshold: 10
    healthyThreshold: 1
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /health
  targetRef:
    group: ""
    kind: Service
    name: sglang-serving-nvfp4-k26
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: sglang-gateway-healthcheck-policy
  namespace: default
spec:
  default:
    checkIntervalSec: 30
    timeoutSec: 30
    unhealthyThreshold: 10
    healthyThreshold: 1
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /health
  targetRef:
    group: "inference.networking.k8s.io"
    kind: InferencePool
    name: sglang-gateway
