apiVersion: batch/v1
kind: Job
metadata:
  name: kimi-nvfp4-gcs-uploader
  namespace: default
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: kimi-nvfp4-gcs-uploader
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-b200
      tolerations:
        - operator: "Exists"
          key: "nvidia.com/gpu"
        - operator: "Exists"
          key: "cloud.google.com/impending-node-termination"
        - operator: "Exists"
          key: "user-workload"
      initContainers:
      - name: download-hf
        image: google/cloud-sdk:slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Installing huggingface_hub and hf_transfer for high-speed download..."
            pip install --no-cache-dir --break-system-packages huggingface_hub hf_transfer
            export HF_HUB_ENABLE_HF_TRANSFER=1
            echo "Starting multi-worker download of nvidia/Kimi-K2.6-NVFP4 onto 12TB NVMe disk..."
            python3 -m huggingface_hub.cli.hf download nvidia/Kimi-K2.6-NVFP4 --local-dir /workspace/Kimi-K2.6-NVFP4 --max-workers 16
            echo "Hugging Face download completed successfully!"
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
              optional: true
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
          limits:
            cpu: "8"
            memory: "32Gi"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      containers:
      - name: upload-gcs
        image: google/cloud-sdk:slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Uploading /workspace/Kimi-K2.6-NVFP4 to gs://ikwak-models-gpu-launchpad-playground/Kimi-K2.6-NVFP4..."
            gcloud storage cp -r /workspace/Kimi-K2.6-NVFP4 gs://ikwak-models-gpu-launchpad-playground/
            echo "GCS upload complete! Model is now saved in gs://ikwak-models-gpu-launchpad-playground/Kimi-K2.6-NVFP4"
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
          limits:
            cpu: "4"
            memory: "16Gi"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      volumes:
      - name: workspace
        emptyDir: {}
