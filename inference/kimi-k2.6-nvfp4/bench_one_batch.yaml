apiVersion: v1
kind: Pod
metadata:
  name: sglang-benchmark-batch-client
  namespace: default
spec:
  nodeName: gke-ikwak-reliabilit-a4-highgpu-8g-a4-5e816978-0bzk
  tolerations:
  - operator: "Exists"
    key: "nvidia.com/gpu"
  - operator: "Exists"
    key: "cloud.google.com/impending-node-termination"
  - operator: "Exists"
    key: "user-workload"
  restartPolicy: Never
  volumes:
  - name: workspace-volume
    emptyDir: {}
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 10Gi
  - name: nvidia-install-dir-host
    hostPath:
      path: /home/kubernetes/bin/nvidia
  - name: hf-cache
    emptyDir: {}
  initContainers:
  - name: pull-tokenizer-from-gcs
    image: google/cloud-sdk:slim
    command: ["/bin/sh", "-c"]
    args:
    - |
      set -ex
      mkdir -p /root/.cache/huggingface/Kimi-K2.6-NVFP4
      for f in config.json tokenizer_config.json tokenization_kimi.py tool_declaration_ts.py tiktoken.model special_tokens_map.json preprocessor_config.json processor_config.json modeling_kimi_k25.py configuration_kimi_k25.py modeling_deepseek.py configuration_deepseek.py generation_config.json hf_quant_config.json; do
        curl -sL "https://huggingface.co/nvidia/Kimi-K2.6-NVFP4/resolve/main/$f" -o "/root/.cache/huggingface/Kimi-K2.6-NVFP4/$f" || true
      done
      echo "Tokenizer files successfully copied from GCS!"
    volumeMounts:
    - name: hf-cache
      mountPath: /root/.cache/huggingface
  containers:
  - name: benchmark
    image: docker.io/lmsysorg/sglang:v0.5.10.post1
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: "2"
        memory: "8Gi"
      requests:
        cpu: "2"
        memory: "8Gi"
    volumeMounts:
    - name: workspace-volume
      mountPath: /workspace
    - name: dshm
      mountPath: /dev/shm
    - name: nvidia-install-dir-host
      mountPath: /usr/local/nvidia
    - name: hf-cache
      mountPath: /root/.cache/huggingface
    command:
    - /bin/bash
    - -c
    args:
    - |
      set -ex
      ldconfig /usr/local/nvidia/lib64/ || true
      export LD_LIBRARY_PATH="/usr/local/nvidia/lib64:$LD_LIBRARY_PATH"
      
      echo "Starting SGLang bench_one_batch_server Load Test..."
      
      # Wait 5 seconds to bypass server startup self-test race conditions
      sleep 5
      
      # Remove hardcoded 600 second timeout and add 30-retry wrapper for server_info and flush_cache
      python3 -c '
      import sglang.test.bench_one_batch_server_internal as mod
      import inspect
      path = inspect.getfile(mod)
      with open(path, "r") as f: c = f.read()
      c = c.replace("DEFAULT_TIMEOUT = 600", "DEFAULT_TIMEOUT = 36000")
      wrapper = """import time\ndef _safe_req(fn, *a, **kw):\n    for _i in range(30):\n        try:\n            r = fn(*a, **kw)\n            if r.status_code == 200: return r\n        except Exception:\n            pass\n        time.sleep(3)\n    return fn(*a, **kw)\n"""
      c = c.replace("import requests", "import requests\n" + wrapper)
      q = chr(34)
      c = c.replace("response = requests.get(url + " + q + "/server_info" + q, "response = _safe_req(requests.get, url + " + q + "/server_info" + q)
      c = c.replace("response = requests.get(base_url + " + q + "/server_info" + q, "response = _safe_req(requests.get, base_url + " + q + "/server_info" + q)
      c = c.replace("response = requests.post(url + " + q + "/flush_cache" + q, "response = _safe_req(requests.post, url + " + q + "/flush_cache" + q)
      with open(path, "w") as f: f.write(c)
      print("Patched DEFAULT_TIMEOUT, server_info, and flush_cache with 30-retry safe wrapper in", path)
      '

      # Pointing to the GKE Inference Gateway Internal Application Load Balancer IP
      API_URL="http://192.168.0.10"
      MODEL_PATH="/root/.cache/huggingface/Kimi-K2.6-NVFP4"
      
      # --- CONFIGURATION START (DO NOT CHANGE ISL/OSL CONFIG) ---
      BATCH_SIZE=64
      INPUT_LEN=1024
      OUTPUT_LEN=4096
      # --- CONFIGURATION END ---
      
      echo "Targeting API: ${API_URL}"
      echo "Model: ${MODEL_PATH}"
      echo "Configuration: Batch Size = ${BATCH_SIZE}, ISL = ${INPUT_LEN}, OSL = ${OUTPUT_LEN}"
      
      python3 -u -m sglang.bench_one_batch_server \
        --base-url "${API_URL}" \
        --model None \
        --tokenizer-path "${MODEL_PATH}" \
        --trust-remote-code \
        --device cpu \
        --batch-size ${BATCH_SIZE} \
        --input-len ${INPUT_LEN} \
        --output-len ${OUTPUT_LEN} \
        --result-filename /workspace/bench_one_batch_server_result_2node_eagle3.json
        
      echo "Benchmark complete! Result saved to /workspace/bench_one_batch_server_result_2node_eagle3.json"
      cat /workspace/bench_one_batch_server_result_2node_eagle3.json
