# GKE Inference Gateway (llm-d) configuration for SGLang MoonshotAI Kimi-K3
# CRITICAL: Uses gke-l7-rilb (Regional Internal Application Load Balancer) per GCP Org Policies
# Routes /v1 through llm-d InferencePool (KV-cache aware request routing) to Kimi-K3 pods (port 30000)

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sglang-inference-gateway
  namespace: default
  labels:
    app: sglang-inference-gateway-k3
spec:
  gatewayClassName: gke-l7-rilb
  listeners:
    - protocol: HTTP
      port: 80
      name: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sglang-inference-route
  namespace: default
  labels:
    app: sglang-inference-gateway-k3
spec:
  parentRefs:
    - name: sglang-inference-gateway
  rules:
    # Route LLM inference endpoints through llm-d InferencePool (KV-cache-aware routing via EPP)
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: sglang-gateway
          group: "inference.networking.k8s.io"
          kind: InferencePool
    # Route administrative and benchmark endpoints (/get_model_info, /health) directly to Kimi-K3 service
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sglang-serving-k3
          port: 30000
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: sglang-gateway
  namespace: default
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sglang-gateway-epp
spec:
  appProtocol: http
  endpointPickerRef:
    failureMode: FailOpen
    group: ""
    kind: Service
    name: sglang-gateway-epp
    port:
      number: 9002
  selector:
    matchLabels:
      app: distributed-sglang-k3
      apps.kubernetes.io/pod-index: "0"
      llm-d.ai/guide: optimized-baseline
  targetPorts:
  - number: 30000
---
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferenceObjective
metadata:
  name: kimi-k3-objective
  namespace: default
  labels:
    app: sglang-inference-gateway-k3
spec:
  priority: 10
  poolRef:
    name: sglang-gateway
    group: "inference.networking.k8s.io"
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: sglang-service-timeout-policy-k3
  namespace: default
spec:
  default:
    timeoutSec: 3600
  targetRef:
    group: ""
    kind: Service
    name: sglang-serving-k3
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: sglang-gateway-timeout-policy-k3
  namespace: default
spec:
  default:
    timeoutSec: 3600
  targetRef:
    group: "inference.networking.k8s.io"
    kind: InferencePool
    name: sglang-gateway
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: sglang-healthcheck-policy-k3
  namespace: default
spec:
  default:
    checkIntervalSec: 30
    timeoutSec: 30
    unhealthyThreshold: 10
    healthyThreshold: 1
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /get_model_info
  targetRef:
    group: ""
    kind: Service
    name: sglang-serving-k3
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: sglang-gateway-healthcheck-policy-k3
  namespace: default
spec:
  default:
    checkIntervalSec: 30
    timeoutSec: 30
    unhealthyThreshold: 10
    healthyThreshold: 1
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /health
  targetRef:
    group: "inference.networking.k8s.io"
    kind: InferencePool
    name: sglang-gateway
