# inference-perf Benchmark Client for MoonshotAI Kimi-K3 (Deep Research Workload on H100)
# Workload template from: https://github.com/kubernetes-sigs/inference-perf/tree/main/workload-catalog/deep-research
# Pareto curve sweep across concurrency levels: 1, 2, 4, 8, 16, 32
# Targets: http://sglang-serving-k3.default.svc.cluster.local:30000

apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-perf-k3-deep-research-config
  namespace: default
data:
  config.yml: |
    server:
      type: sglang
      base_url: http://sglang-serving-k3.default.svc.cluster.local:30000
      model_name: moonshotai/Kimi-K3
      ignore_eos: false
    tokenizer:
      pretrained_model_name_or_path: moonshotai/Kimi-K3
      trust_remote_code: true
    data:
      type: random
      input_distribution:
        min: 32768
        max: 32768
        mean: 32768
        std_dev: 0
      output_distribution:
        min: 1024
        max: 1024
        mean: 1024
        std_dev: 0
    load:
      type: concurrent
      num_workers: 8
      worker_max_concurrency: 1000
      request_timeout: 36000
      stages:
      - num_requests: 16
        concurrency_level: 1
      - num_requests: 16
        concurrency_level: 2
      - num_requests: 16
        concurrency_level: 4
      - num_requests: 16
        concurrency_level: 8
      - num_requests: 16
        concurrency_level: 16
      - num_requests: 32
        concurrency_level: 32
      - num_requests: 64
        concurrency_level: 64
      - num_requests: 128
        concurrency_level: 128
      - num_requests: 256
        concurrency_level: 256
      - num_requests: 512
        concurrency_level: 512
    api:
      type: completion
      streaming: true
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inference-perf-k3-deep-research
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: inference-perf-k3-deep-research
    spec:
      serviceAccountName: default
      restartPolicy: Never
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: benchmark
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -ex
          pip install -q -U inference-perf PyYAML==6.0.3 matplotlib pandas
          echo "======================================================================="
          echo "Running inference-perf Deep Research benchmark for Kimi-K3"
          echo "Workload: kubernetes-sigs/inference-perf workload-catalog/deep-research"
          echo "Stages: Concurrency 1, 2, 4, 8, 16, 32 (20 requests/stage)"
          echo "======================================================================="
          inference-perf -c /config/config.yml
          echo "Benchmark Completed Successfully!"
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
              optional: true
        resources:
          requests:
            cpu: "8"
            memory: "16Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        volumeMounts:
        - name: config-volume
          mountPath: /config
      volumes:
      - name: config-volume
        configMap:
          name: inference-perf-k3-deep-research-config
