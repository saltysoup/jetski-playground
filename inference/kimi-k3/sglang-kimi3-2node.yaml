apiVersion: v1
kind: Service
metadata:
  name: sglang-master-pod-k3
  namespace: default
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: distributed-sglang-k3
    apps.kubernetes.io/pod-index: "0"
  ports:
  - name: dist-port
    port: 20000
    targetPort: 20000
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-serving-k3
  namespace: default
  labels:
    app: distributed-sglang-k3
spec:
  type: ClusterIP
  selector:
    app: distributed-sglang-k3
    apps.kubernetes.io/pod-index: "0"
  ports:
  - name: http
    port: 30000
    targetPort: 30000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: distributed-sglang-k3
  namespace: default
spec:
  serviceName: "sglang-master-pod-k3"
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: distributed-sglang-k3
  template:
    metadata:
      labels:
        app: distributed-sglang-k3
        llm-d.ai/guide: optimized-baseline
      annotations:
        gke-gcsfuse/volumes: "true"
        networking.gke.io/default-interface: 'eth0'
        networking.gke.io/interfaces: |
          [
            {"interfaceName":"eth0","network":"default"},
            {"interfaceName":"eth1","network":"gvnic-1"},
            {"interfaceName":"eth2","network":"rdma-0"},
            {"interfaceName":"eth3","network":"rdma-1"},
            {"interfaceName":"eth4","network":"rdma-2"},
            {"interfaceName":"eth5","network":"rdma-3"},
            {"interfaceName":"eth6","network":"rdma-4"},
            {"interfaceName":"eth7","network":"rdma-5"},
            {"interfaceName":"eth8","network":"rdma-6"},
            {"interfaceName":"eth9","network":"rdma-7"}
          ]
    spec:
      volumes:
      - name: library-dir-host
        hostPath:
          path: /home/kubernetes/bin/nvidia
      - name: gib
        hostPath:
          path: /home/kubernetes/bin/gib
      - emptyDir:
          medium: Memory
          sizeLimit: 250Gi
        name: dshm
      - name: hf-cache
        hostPath:
          path: /mnt/stateful_partition/kube-ephemeral-ssd/huggingface_cache
          type: DirectoryOrCreate
      - name: gcs-fuse-csi-eph
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: ikwak-models-gpu-launchpad-playground
            gcsfuseMetadataPrefetchOnMount: "true"
            mountOptions: "implicit-dirs,file-mode=777,dir-mode=777,file-cache:enable-parallel-downloads:true,file-cache:cache-file-for-range-read:true,file-cache:max-size-mb:-1,write:enable-streaming-writes:true,read_ahead_kb=1024,file-system:kernel-list-cache-ttl-secs:-1"
      serviceAccountName: workload-identity-k8s-sa
      containers:
      - name: sglang-container
        image: docker.io/lmsysorg/sglang:kimi-k3
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - |
          cat << 'EOF' > /tmp/shim_dev.c
          extern int ncclCommInitRank(void** comm, int nranks, void* commId, int myrank);
          int ncclDevCommCreate(void** comm, int nranks, void* commId, int myrank, int config) {
              return ncclCommInitRank(comm, nranks, commId, myrank);
          }
          int ncclDevCommDestroy(void* comm, void* devComm) { return 0; }
          int ncclAlltoAll(const void* sendbuff, void* recvbuff, unsigned long count, int datatype, void* comm, void* stream) { return 0; }
          EOF
          gcc -shared -fPIC -o /usr/local/gib/lib64/libnccl_dev_shim.so /tmp/shim_dev.c
          for f in $(find /usr/ /lib/ /root/ -name "libnccl.so*" 2>/dev/null | grep -v "/usr/local/gib"); do
            ln -sf /usr/local/gib/lib64/libnccl.so.2 "$f"
          done
          /sbin/ldconfig || true
          export NCCL_NET=gIB
          source /usr/local/gib/scripts/set_nccl_env.sh
          echo "source /usr/local/gib/scripts/set_nccl_env.sh" >> /root/.bashrc
          MY_IP=$(hostname -I | awk '{print $1}')
          export SGLANG_HOST_IP="${MY_IP}"
          echo "=========================================================="
          echo "Launching SGLang multi-node for moonshotai/Kimi-K3..."
          echo "Node Rank: $POD_INDEX | dist-init-addr: sglang-master-pod-k3:20000"
          echo "=========================================================="

          sglang serve \
              --trust-remote-code \
              --model-path /bucket/Kimi-K3 \
              --served-model-name moonshotai/Kimi-K3 \
              --load-format runai_streamer \
              --enable-metrics \
              --tp-size 16 \
              --nnodes 2 \
              --node-rank $POD_INDEX \
              --dist-init-addr sglang-master-pod-k3:20000 \
              --mem-fraction-static 0.85 \
              --disable-flashinfer-autotune \
              --watchdog-timeout 3600 \
              --reasoning-parser kimi_k3 \
              --tool-call-parser kimi_k3 \
              --model-loader-extra-config '{"memory_limit": 34359738368}' \
              --mamba-full-memory-ratio 0.43 \
              --host 0.0.0.0 \
              --port 30000 \
              --speculative-algorithm DSPARK \
              --speculative-draft-model-path /bucket/Kimi-K3-DSpark \
              --speculative-dspark-block-size 7 \
              --enable-linear-replayssm-spec \
              --max-running-requests 512 \
              --cuda-graph-max-bs 512
        env:
        - name: POD_INDEX
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
              optional: true
        - name: LD_LIBRARY_PATH
          value: "/usr/local/nvidia/lib64"
        - name: LD_PRELOAD
          value: "/usr/local/gib/lib64/libnccl_dev_shim.so"
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        - name: NCCL_DEBUG
          value: WARN
        - name: SGLANG_REQUEST_STATE_WAIT_TIMEOUT
          value: "18000"
        - name: OMP_NUM_THREADS
          value: "24"
        - name: SGLANG_SET_CPU_AFFINITY
          value: "0"
        - name: SAFETENSORS_FAST_GPU
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: RUNAI_STREAMER_MEMORY_LIMIT
          value: "34359738368"
        - name: RUNAI_STREAMER_CONCURRENCY
          value: "16"
        - name: SGLANG_USE_RUNAI_MODEL_STREAMER
          value: "true"
        resources:
          limits:
            nvidia.com/gpu: "8"
            cpu: "206"
            memory: "1500Gi"
          requests:
            nvidia.com/gpu: "8"
            cpu: "206"
            memory: "1500Gi"
        volumeMounts:
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /root/.cache/huggingface
            name: hf-cache
          - name: library-dir-host
            mountPath: /usr/local/nvidia
          - name: gib
            mountPath: /usr/local/gib
          - name: gcs-fuse-csi-eph
            mountPath: /bucket
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-b200
        cloud.google.com/gke-nodepool: a4-highgpu-8g-a4-pool
      tolerations:
        - operator: "Exists"
