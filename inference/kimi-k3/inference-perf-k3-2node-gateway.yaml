# inference-perf Benchmark Client for MoonshotAI Kimi-K3 (2-Node GKE Inference Gateway)
# Standardized at ISL=1024, OSL=8192, BS=512 (concurrency_level=512, num_requests=512)
# Targets: http://192.168.0.10 (GKE L7 RILB VIP)

apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-perf-k3-gateway-config
  namespace: default
data:
  config.yml: |
    server:
      type: open_ai
      base_url: http://192.168.0.10
      ignore_eos: false
    tokenizer:
      pretrained_model_name_or_path: moonshotai/Kimi-K3
      trust_remote_code: true
    data:
      type: random
      input_distribution:
        min: 1024
        max: 1024
        mean: 1024
        std_dev: 0
        total_count: 512
      output_distribution:
        min: 8192
        max: 8192
        mean: 8192
        std_dev: 0
        total_count: 512
    load:
      type: concurrent
      num_workers: 8
      worker_max_concurrency: 1000
      request_timeout: 36000
      stages:
      - num_requests: 512
        concurrency_level: 512
    api:
      type: completion
      streaming: true
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inference-perf-k3-2node-gateway
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: inference-perf-k3-2node-gateway
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
      - name: benchmark
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -ex
          pip install -q -U inference-perf PyYAML==6.0.3
          echo "======================================================================="
          echo "Running inference-perf Gateway Service benchmark for Kimi-K3"
          echo "ISL: 1024 | OSL: 8192 | BS: 512 | Concurrency: 512"
          echo "======================================================================="
          inference-perf -c /config/config.yml
          echo "Benchmark Completed Successfully!"
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
              optional: true
        resources:
          requests:
            cpu: "8"
            memory: "16Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        volumeMounts:
        - name: config-volume
          mountPath: /config
      volumes:
      - name: config-volume
        configMap:
          name: inference-perf-k3-gateway-config
