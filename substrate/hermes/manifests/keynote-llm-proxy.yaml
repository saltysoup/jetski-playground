# Service the Hermes agents use to reach the keynote driver's LLM proxy
# (-llm-listen :8091). The agents' MODEL_BASE_URL points here:
#   http://keynote-llm-proxy.keynote-demo.svc.cluster.local:8091/llm/v1
apiVersion: v1
kind: Service
metadata:
  name: keynote-llm-proxy
  namespace: keynote-demo
spec:
  selector:
    app: keynote-driver
  ports:
  - name: llm
    port: 8091
    targetPort: 8091
