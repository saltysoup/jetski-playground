# gaie-pd (inferencepool chart v1.2.0) values — Phase 2:
# Phase 1 (precise KV-cache-aware routing) + llm-d flow control + header-based
# pod steering.
#
#  * Flow control (featureGates: flowControl) = admission/queuing layer. It reads
#      x-llm-d-inference-objective   -> InferenceObjective -> priority band
#      x-llm-d-inference-fairness-id -> fairness flow within a band
#    and only queues when the saturation detector says the pool is full.
#    It does NOT choose pods.
#  * Pod steering = scheduling layer: header-label-affinity-scorer gives score 1
#    to the endpoint whose label llm-d.ai/replica equals the x-target-pod header
#    (pod-1 / pod-2), 0 otherwise. Weight 100 >> sum of the other weights (7),
#    so the header wins whenever that pod is a candidate; with no header it
#    contributes 0 and KV-cache-aware scoring decides.
inferenceExtension:
  extProcPort: 9002
  image:
    hub: ghcr.io/llm-d
    name: llm-d-router-endpoint-picker
    pullPolicy: IfNotPresent
    tag: v0.10.0
  monitoring:
    interval: 10s
    prometheus:
      auth:
        enabled: false
      enabled: false
  nodeSelector:
    cloud.google.com/gke-nodepool: default-pool
  replicas: 1
  pluginsConfigFile: kv-aware-flowctl-config.yaml
  pluginsCustomConfig:
    kv-aware-flowctl-config.yaml: |
      apiVersion: llm-d.ai/v1alpha1
      kind: EndpointPickerConfig
      featureGates:
      - flowControl
      plugins:
      - type: token-producer
        parameters:
          modelName: google/gemma-4-12B-it
          vllm:
            url: http://gemma4-12b-render.default.svc.cluster.local:8000
      - type: endpoint-notification-source
      - type: precise-prefix-cache-producer
        parameters:
          tokenProcessorConfig:
            blockSizeTokens: 64
          speculativeIndexing: true
          indexerConfig:
            kvBlockIndexConfig:
              enableMetrics: true
          kvEventsConfig:
            topicFilter: "kv@"
            concurrency: 4
            discoverPods: true
            podDiscoveryConfig:
              socketPort: 5557
      - type: prefix-cache-scorer
        parameters:
          prefixMatchInfoProducerName: precise-prefix-cache-producer
      - type: queue-scorer
      - type: kv-cache-utilization-scorer
      - type: header-label-affinity-scorer
        name: target-pod-affinity
        parameters:
          headerName: x-target-pod
          labelKey: llm-d.ai/replica
      - type: max-score-picker
      - type: single-profile-handler
      # Flow control policies + saturation detector (llm-d flow-control guide).
      - type: round-robin-fairness-policy
      - type: fcfs-ordering-policy
      - type: concurrency-detector
        parameters:
          # Per-pod ideal in-flight requests; pool capacity = 2 x 256.
          # 256 = vLLM max_num_seqs on these pods (not set by us; vLLM default).
          maxConcurrency: 256
          concurrencyMode: requests
          headroom: 0.0
      dataLayer:
        sources:
        - pluginRef: endpoint-notification-source
          extractors:
          - pluginRef: precise-prefix-cache-producer
      schedulingProfiles:
      - name: default
        plugins:
        - pluginRef: target-pod-affinity
          weight: 100
        - pluginRef: prefix-cache-scorer
          weight: 3
        - pluginRef: queue-scorer
          weight: 2
        - pluginRef: kv-cache-utilization-scorer
          weight: 2
        - pluginRef: max-score-picker
      flowControl:
        maxBytes: "10Gi"
        maxRequests: "4k"
        defaultRequestTTL: "120s"
        saturationDetector:
          pluginRef: concurrency-detector
        priorityBands:
        - priority: 100
          maxRequests: "2k"
          fairnessPolicyRef: round-robin-fairness-policy
          orderingPolicyRef: fcfs-ordering-policy
        - priority: 0
          maxRequests: "2k"
          fairnessPolicyRef: round-robin-fairness-policy
          orderingPolicyRef: fcfs-ordering-policy
        - priority: -10
          maxRequests: "2k"
          fairnessPolicyRef: round-robin-fairness-policy
          orderingPolicyRef: fcfs-ordering-policy
inferencePool:
  modelServerType: vllm
  modelServers:
    matchLabels:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/model: gemma-4-12b-it
  targetPorts:
  - number: 8000
