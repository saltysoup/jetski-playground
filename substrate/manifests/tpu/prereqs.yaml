# Objects the vLLM Deployments (gemma4-12b-torchtpu-deployments.yaml) depend on.
# In the demo cluster these came from the Qwiklab "Deploy Disaggregated TPU vLLM
# Inferencing with llm-d on GKE" setup (the ServiceAccount is owned by its
# llm-d-modelservice Helm release "ms-pd"). The names are kept so the Deployments
# work unchanged. The Hugging Face token Secret is created separately:
#   kubectl create secret generic llm-d-hf-token --from-literal=HF_TOKEN="${HF_TOKEN}"
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hyperdisk-balanced
provisioner: pd.csi.storage.gke.io
parameters:
  type: hyperdisk-balanced
  provisioned-iops-on-create: "10000"
  provisioned-throughput-on-create: 500Mi
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ms-pd-llm-d-modelservice
  namespace: default
---
# Hugging Face cache for pod-1 (bound on first use to the tpu-v6e-spot node's zone).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-storage-ms-pd-llm-d-modelservice-prefill-0
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: hyperdisk-balanced
  resources:
    requests:
      storage: 200Gi
---
# Hugging Face cache for pod-2.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-storage-decode
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: hyperdisk-balanced
  resources:
    requests:
      storage: 200Gi
