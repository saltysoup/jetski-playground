=====RENDER
# ClusterIP Service fronting the two Gemma 4 12B vLLM pods so the EPP
# token-producer can call vLLM's /v1/*/render endpoints (tokenization only).
# Mirrors the llm-d precise-prefix-cache-routing guide's default "render"
# overlay (render served by the model servers themselves).
apiVersion: v1
kind: Service
metadata:
  name: gemma4-12b-render
  namespace: default
  labels:
    app: gemma4-12b-torchtpu
spec:
  type: ClusterIP
  selector:
    app: gemma4-12b-torchtpu
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
====OBJ
# InferenceObjectives for llm-d flow control (priority bands), adapted from the
# llm-d flow-control guide. Legacy group (inference.networking.x-k8s.io) because
# that is the only InferenceObjective CRD installed on this cluster; the v0.10.0
# EPP auto-detects and watches it. poolRef.group defaults to
# inference.networking.k8s.io (matches the gaie-pd InferencePool).
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferenceObjective
metadata:
  name: premium-traffic
  namespace: default
spec:
  priority: 100
  poolRef:
    name: gaie-pd
---
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferenceObjective
metadata:
  name: standard-traffic
  namespace: default
spec:
  priority: 0
  poolRef:
    name: gaie-pd
---
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferenceObjective
metadata:
  name: best-effort-traffic
  namespace: default
spec:
  priority: -10
  poolRef:
    name: gaie-pd

