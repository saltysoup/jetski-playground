# In-cluster Envoy gateway in front of the two vLLM pods (hostPort 8080).
#
# Two paths on the same listener:
#  * default: ext_proc -> llm-d EPP (gaie-pd-epp) picks the pod (precise
#    KV-cache-aware scoring, header steering, flow control) and Envoy forwards
#    to it via ORIGINAL_DST (x-gateway-destination-endpoint).
#  * x-route-mode: round-robin: "no llm-d" baseline for the keynote's Stage 1.
#    ext_proc is disabled on this route, so the EPP never sees the request;
#    Envoy spreads requests ROUND_ROBIN over the vLLM pods, resolved through
#    the headless Service gemma4-12b-vllm-pods (follows pod IP changes).
#
# Envoy reads this file only at start: kubectl rollout restart
# deploy/llmd-envoy-gateway after changing it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llmd-envoy-gateway-config
  namespace: default
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 19000 }
    static_resources:
      listeners:
        - name: http-gateway-listener
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: llmd-http
                    route_config:
                      name: vllm_route
                      virtual_hosts:
                        - name: vllm_host
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                                headers:
                                  - name: x-route-mode
                                    string_match: { exact: round-robin }
                              route:
                                cluster: vllm_round_robin
                                timeout: 3600s
                                idle_timeout: 3600s
                              typed_per_filter_config:
                                envoy.filters.http.ext_proc:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                                  disabled: true
                            - match: { prefix: "/" }
                              route:
                                cluster: original_destination_cluster
                                timeout: 3600s
                                idle_timeout: 3600s
                    http_filters:
                      - name: envoy.filters.http.ext_proc
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                          grpc_service:
                            envoy_grpc:
                              cluster_name: ext_proc
                              authority: gaie-pd-epp.default.svc.cluster.local:9002
                            timeout: 60s
                          processing_mode:
                            request_header_mode: SEND
                            response_header_mode: SEND
                            request_body_mode: FULL_DUPLEX_STREAMED
                            response_body_mode: FULL_DUPLEX_STREAMED
                            request_trailer_mode: SEND
                            response_trailer_mode: SEND
                          message_timeout: 1000s
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          suppress_envoy_headers: true
      clusters:
        - name: original_destination_cluster
          type: ORIGINAL_DST
          connect_timeout: 30s
          lb_policy: CLUSTER_PROVIDED
          circuit_breakers:
            thresholds:
              - max_connections: 40000
                max_pending_requests: 40000
                max_requests: 40000
          original_dst_lb_config:
            use_http_header: true
            http_header_name: x-gateway-destination-endpoint
        - name: ext_proc
          type: STATIC
          connect_timeout: 10s
          lb_policy: LEAST_REQUEST
          circuit_breakers:
            thresholds:
              - max_connections: 40000
                max_pending_requests: 40000
                max_requests: 40000
                max_retries: 1024
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options:
                  initial_stream_window_size: 65536
                  initial_connection_window_size: 1048576
          transport_socket:
            name: "envoy.transport_sockets.tls"
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                validation_context: {}
          load_assignment:
            cluster_name: ext_proc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 172.24.18.142
                          port_value: 9002
        # "No llm-d" baseline: plain round robin over the Ready vLLM pods. The
        # headless Service resolves to one A record per pod, and STRICT_DNS
        # makes each returned IP a host.
        - name: vllm_round_robin
          type: STRICT_DNS
          dns_lookup_family: V4_ONLY
          dns_refresh_rate: 5s
          connect_timeout: 10s
          lb_policy: ROUND_ROBIN
          circuit_breakers:
            thresholds:
              - max_connections: 40000
                max_pending_requests: 40000
                max_requests: 40000
          load_assignment:
            cluster_name: vllm_round_robin
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: gemma4-12b-vllm-pods.default.svc.cluster.local
                          port_value: 8000
---
# Headless Service over the vLLM pods (same labels as the InferencePool), used
# only by the round-robin route above.
apiVersion: v1
kind: Service
metadata:
  name: gemma4-12b-vllm-pods
  namespace: default
spec:
  clusterIP: None
  selector:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/model: gemma-4-12b-it
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmd-envoy-gateway
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate   # hostPort 8080 on one node: a surge pod could never schedule
  selector:
    matchLabels:
      app: llmd-envoy-gateway
  template:
    metadata:
      labels:
        app: llmd-envoy-gateway
    spec:
      nodeSelector:
        cloud.google.com/machine-family: c4   # the C4 CPU node; TPU nodes are tainted
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.39-latest@sha256:57e14a549d7bd43c8d3f6d03e8cfa653e037d4b38e133acd9b54f38c524401b4
          args: ["-c", "/etc/envoy/envoy.yaml", "--concurrency", "4"]
          ports:
            - containerPort: 8080
              hostPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
      volumes:
        - name: config
          configMap:
            name: llmd-envoy-gateway-config
