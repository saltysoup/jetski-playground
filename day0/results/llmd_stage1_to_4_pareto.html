        </div>
      </div>
    </div>

    const X_META = {

      dec_tpot_ms:    { label: "P90 Decode Inter-Token Latency / TPOT (ms/tok — 10ms units)  [← Lower is Better]", unit: "ms", max: 40, step: 10, higherBetter: false },
      p90_ttft_ms:    { label: "P90 Time to First Token — TTFT (ms)  [← Lower is Better]", unit: "ms", max: 10000, step: 2000, higherBetter: false },
      e2e_int:        { label: "P90 E2E Normalized Interactivity (tok/s/user — InferenceX X-Axis)  [→ Higher is Better]", unit: "", max: 250, step: 50, higherBetter: true }
    };

      out_tput_chip: { label: "Output Throughput / Chip (tok/s/chip)  [↑ Higher is Better]", unit: "tok/s/chip", max: 1600 },

      tot_tput_chip: { label: "Total Throughput / Chip (tok/s/chip)  [↑ Higher is Better]", unit: "tok/s/chip", max: 225000 },
      tot_tput_pool: { label: "Pool Total Throughput (tok/s — 8× B200)  [↑ Higher is Better]", unit: "tok/s", max: 1800000 }
    };

    const svg = document.getElementById("plotSvg");
    const tooltip = document.getElementById("tooltip");
    const xAxisSel = document.getElementById("xAxisSel");
    const yAxisSel = document.getElementById("yAxisSel");
    const s3ModeSel = document.getElementById("s3ModeSel");
    const legendBar = document.getElementById("legendBar");

    function fmtNum(v) {
      if (v >= 1000000) return (v / 1000000).toFixed(2) + "M";
      if (v >= 10000) return (v / 1000).toFixed(1) + "k";
      if (v >= 1000) return (v / 1000).toFixed(2) + "k";
      if (v >= 100) return v.toFixed(1);
      return v.toFixed(2);
    }

    function renderLegend() {
      legendBar.innerHTML = "";
      const left = document.createElement("div");
      left.className = "flex flex-wrap items-center gap-2";
      STAGES.forEach(s => {
        const btn = document.createElement("button");
        btn.className = `flex items-center gap-1.5 px-2 py-1 rounded-md border border-[var(--border)] text-xs transition ${
          s.visible ? "bg-[var(--card)] font-semibold opacity-100" : "opacity-40"
        }`;
        btn.innerHTML = `
          <span class="w-3 h-3 rounded-full inline-block" style="background:${s.color}"></span>
          <span>${s.name}</span>
        `;
        btn.addEventListener("click", () => {
          s.visible = !s.visible;
          renderLegend();
          renderPlot();
        });
        left.appendChild(btn);
      });
      legendBar.appendChild(left);
    }

    function renderPlot() {
      const xKey = xAxisSel.value;
      const yKey = yAxisSel.value;
      const xInfo = X_META[xKey];
      const yInfo = Y_META[yKey];

      const isLight = document.documentElement.classList.contains("light");
      const gridColor = isLight ? "#e2e8f0" : "#1e293b";
      const axisColor = isLight ? "#475569" : "#94a3b8";
      const labelColor = isLight ? "#0f172a" : "#f8fafc";

      const W = 740, H = 320;
      const padL = 68, padR = 32, padT = 22, padB = 44;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const maxX = xInfo.max;
      const stepX = xInfo.step;
      const maxY = yInfo.max;

      const xScale = v => padL + (v / maxX) * plotW;
      const yScale = v => padT + plotH - (v / maxY) * plotH;

      svg.innerHTML = "";

      // X-axis grid lines & ticks
      for (let val = 0; val <= maxX; val += stepX) {
        const x = xScale(val);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x);
        line.setAttribute("y1", padT);
        line.setAttribute("x2", x);
        line.setAttribute("y2", padT + plotH);
        line.setAttribute("stroke", gridColor);
        line.setAttribute("stroke-width", "1");
        svg.appendChild(line);

        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("x", x);
        t.setAttribute("y", padT + plotH + 16);
        t.setAttribute("text-anchor", "middle");
        t.setAttribute("fill", axisColor);
        t.setAttribute("font-size", "12");
        t.textContent = xInfo.unit ? `${val}${xInfo.unit}` : `${val}`;
        svg.appendChild(t);
      }

      // Y-axis grid lines & ticks
      const yTicks = 5;
      for (let i = 0; i <= yTicks; i++) {
        const val = (maxY / yTicks) * i;
        const y = yScale(val);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", padL);
        line.setAttribute("y1", y);
        line.setAttribute("x2", padL + plotW);
        line.setAttribute("y2", y);
        line.setAttribute("stroke", gridColor);
        line.setAttribute("stroke-width", "1");
        svg.appendChild(line);

        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("x", padL - 8);
        t.setAttribute("y", y + 4);
        t.setAttribute("text-anchor", "end");
        t.setAttribute("fill", axisColor);
        t.setAttribute("font-size", "12");
        t.textContent = fmtNum(val);
        svg.appendChild(t);
      }

      // Axis Titles
      const xTitle = document.createElementNS("http://www.w3.org/2000/svg", "text");
      xTitle.setAttribute("x", padL + plotW / 2);
      xTitle.setAttribute("y", H - 6);
      xTitle.setAttribute("text-anchor", "middle");
      xTitle.setAttribute("fill", labelColor);
      xTitle.setAttribute("font-size", "12");
      xTitle.setAttribute("font-weight", "600");
      xTitle.textContent = xInfo.label;
      svg.appendChild(xTitle);

      const yTitle = document.createElementNS("http://www.w3.org/2000/svg", "text");
      yTitle.setAttribute("transform", `translate(16, ${padT + plotH / 2}) rotate(-90)`);
      yTitle.setAttribute("text-anchor", "middle");
      yTitle.setAttribute("fill", labelColor);
      yTitle.setAttribute("font-size", "12");
      yTitle.setAttribute("font-weight", "600");
      yTitle.textContent = yInfo.label;
      svg.appendChild(yTitle);

      // Draw "Ideal Frontier" callout badge
      const badgeG = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const badgeRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      badgeRect.setAttribute("x", padL + plotW - 224);
      badgeRect.setAttribute("y", padT + 6);
      badgeRect.setAttribute("width", 218);
      badgeRect.setAttribute("height", 22);
      badgeRect.setAttribute("rx", 5);
      badgeRect.setAttribute("fill", "#06b6d422");
      badgeRect.setAttribute("stroke", "#06b6d4");
      badgeG.appendChild(badgeRect);

      const badgeTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      badgeTxt.setAttribute("x", padL + plotW - 115);
      badgeTxt.setAttribute("y", padT + 21);
      badgeTxt.setAttribute("text-anchor", "middle");
      badgeTxt.setAttribute("fill", "#06b6d4");
      badgeTxt.setAttribute("font-size", "11.5");
      badgeTxt.setAttribute("font-weight", "600");
      badgeTxt.textContent = xInfo.higherBetter
        ? "↗ Ideal Frontier (High Tput, High Int)"
        : "↖ Ideal Frontier (High Tput, Low Lat)";
      badgeG.appendChild(badgeTxt);
      svg.appendChild(badgeG);

      // Draw curves and points (connected in concurrency order within each series!)
      STAGES.forEach(s => {
        if (!s.visible) return;
        const sorted = [...s.points].sort((a, b) => a.conc_rep - b.conc_rep);

        // Path
        let d = "";
        sorted.forEach((p, idx) => {
          const px = xScale(p[xKey]);
          const py = yScale(p[yKey]);
          d += (idx === 0 ? "M" : "L") + px.toFixed(1) + "," + py.toFixed(1);
        });
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", s.color);
        path.setAttribute("stroke-width", s.id === "stage4" ? "3.2" : "2.6");
        if (s.dashed) path.setAttribute("stroke-dasharray", "6,4");
        svg.appendChild(path);

        // Points + Labels
        sorted.forEach((p, idx) => {
          const px = xScale(p[xKey]);
          const py = yScale(p[yKey]);

          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", px);
          circle.setAttribute("cy", py);
          circle.setAttribute("r", s.id === "stage4" ? "6.5" : "5.5");
          circle.setAttribute("fill", s.color);
          circle.setAttribute("stroke", isLight ? "#ffffff" : "#090b0e");
          circle.setAttribute("stroke-width", "2");
          circle.style.cursor = "pointer";
          attachTooltip(circle, s, p);
          svg.appendChild(circle);

          const lbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
          let dy = -8;
          let dx = 7;
          let anchor = "start";
          if (s.id === "stage3a") {
            dy = -9;
            dx = -6;
            anchor = "end";
          } else if (s.id === "stage2") {
            dy = 15;
            dx = 6;
          } else if (s.id === "stage1") {
            dy = 15;
            dx = 6;
          } else if (s.id === "stage3b") {
            dy = 14;
            dx = 7;
            if (idx === sorted.length - 1 && !xInfo.higherBetter) {
              anchor = "end";
              dx = -9;
              dy = -8;
            }
          } else if (s.id === "stage4") {
            dy = -9;
            dx = 7;
            if (idx === 0) {
              dy = -10;
              dx = -4;
            }
          }
          lbl.setAttribute("x", px + dx);
          lbl.setAttribute("y", py + dy);
          lbl.setAttribute("text-anchor", anchor);
          lbl.setAttribute("fill", s.color);
          lbl.setAttribute("font-size", "11.5");
          lbl.setAttribute("font-weight", "600");
          lbl.textContent = `${p.tag}`;
          svg.appendChild(lbl);
        });
      });
    }

    function attachTooltip(el, s, p) {
      el.addEventListener("mouseenter", () => {
        tooltip.classList.remove("hidden");
        tooltip.innerHTML = `
          <div class="font-bold mb-1" style="color:${s.color}">${s.name}</div>
          <div class="text-[var(--foreground)] font-medium mb-1">Config: ${p.label}</div>
          <div>Output Tput / Chip: <span class="font-semibold">${p.out_tput_chip.toFixed(1)} tok/s/chip</span> (Pool: ${fmtNum(p.out_tput_pool)} tok/s)</div>
          <div>Total Tput / Chip: <span class="font-semibold">${fmtNum(p.tot_tput_chip)} tok/s/chip</span> (Pool: ${fmtNum(p.tot_tput_pool)} tok/s)</div>
          <div class="mt-1 pt-1 border-t border-[var(--border)]">
            <div>P90 E2E Latency / Token: <span class="font-semibold">${p.e2e_lat_ms_tok.toFixed(2)} ms/tok</span> (${p.e2e_int.toFixed(1)} tok/s/user)</div>
            <div>P90 Decode TPOT / ITL: <span class="font-semibold">${p.dec_tpot_ms.toFixed(2)} ms/tok</span> (${p.dec_int.toFixed(1)} tok/s/user)</div>
            <div>P90 TTFT Latency: <span class="font-semibold">${p.p90_ttft_ms.toFixed(1)} ms</span> (${(p.p90_ttft_ms / 1000).toFixed(2)}s)</div>
            <div>GPU Prefix Cache Hit: <span class="font-semibold">${p.kv_hit}</span></div>
          </div>
          <div class="mt-1 pt-1 border-t border-[var(--border)] text-[var(--muted-foreground)]">${p.note}</div>
        `;
      });
      el.addEventListener("mousemove", e => {
        const rect = svg.getBoundingClientRect();
        let left = e.clientX - rect.left + 14;
        let top = e.clientY - rect.top - 10;
        if (left > rect.width - 280) left -= 290;
        if (top > rect.height - 170) top = Math.max(4, rect.height - 180);
        tooltip.style.left = left + "px";
        tooltip.style.top = top + "px";
      });
      el.addEventListener("mouseleave", () => {
        tooltip.classList.add("hidden");
      });
    }

    s3ModeSel.addEventListener("change", () => {
      const mode = s3ModeSel.value;
      const s3a = STAGES.find(s => s.id === "stage3a");
      const s3b = STAGES.find(s => s.id === "stage3b");
      if (mode === "both") {
        s3a.visible = true;
        s3b.visible = true;
      } else if (mode === "3b_only") {
        s3a.visible = false;
        s3b.visible = true;
      } else if (mode === "3a_only") {
        s3a.visible = true;
        s3b.visible = false;
      }
      renderLegend();
      renderPlot();
    });

    xAxisSel.addEventListener("change", renderPlot);
    yAxisSel.addEventListener("change", renderPlot);

    renderLegend();
    renderPlot();
  </script>
</body>
</html>
