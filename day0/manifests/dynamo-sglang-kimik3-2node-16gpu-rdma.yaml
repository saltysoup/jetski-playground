apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-sglang-w1
  namespace: ubench-llmd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dynamo-sglang-worker
      replica: w1
  template:
    metadata:
      annotations:
        networking.gke.io/default-interface: 'eth0'
        networking.gke.io/interfaces: |
          [
            {"interfaceName":"eth0","network":"default"},
            {"interfaceName":"eth1","network":"gvnic-1"},
            {"interfaceName":"eth2","network":"rdma-0"},
            {"interfaceName":"eth3","network":"rdma-1"},
            {"interfaceName":"eth4","network":"rdma-2"},
            {"interfaceName":"eth5","network":"rdma-3"},
            {"interfaceName":"eth6","network":"rdma-4"},
            {"interfaceName":"eth7","network":"rdma-5"},
            {"interfaceName":"eth8","network":"rdma-6"},
            {"interfaceName":"eth9","network":"rdma-7"}
          ]
      labels:
        app: dynamo-sglang-worker
        replica: w1
    spec:
      nodeSelector:
        kubernetes.io/hostname: gke-ikwak-reliabilit-a4-highgpu-8g-a4-0256e2f1-34t3
      serviceAccountName: workload-identity-k8s-sa
      tolerations:
      - operator: Exists
      containers:
      - name: sglang
        image: lmsysorg/sglang:nightly-dev-cu13-20260922-582389ce@sha256:0e1b14e302619a42ef5581b87db6804651d4f946301cf543d74a3a1eb1c33b40
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          capabilities:
            add:
            - IPC_LOCK
            - SYS_RESOURCE
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          ulimit -l unlimited || true
          export PATH=/usr/local/gib/bin:$PATH
          export LD_LIBRARY_PATH=/usr/local/gib/lib64:/usr/local/nvidia/lib64:$LD_LIBRARY_PATH
          source /usr/local/gib/scripts/set_nccl_env.sh
          export NCCL_NET=IB
          export NCCL_NET_PLUGIN=none
          export NCCL_TUNER_PLUGIN=none
          export NCCL_PROFILER_PLUGIN=none
          export GLOO_SOCKET_IFNAME=eth0
          export NCCL_SOCKET_IFNAME=eth0
          export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
          export SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN=1
          exec python3 -m sglang.launch_server \
            --model-path /mnt/lustre_1000mbps/models/nvidia/Kimi-K3-NVFP4 \
            --served-model-name moonshotai/Kimi-K3 \
            --host 0.0.0.0 \
            --port 8888 \
            --trust-remote-code \
            --nnodes 2 \
            --node-rank 0 \
            --dist-init-addr dynamo-sglang-w1.ubench-llmd.svc.cluster.local:29500 \
            --tp-size 16 \
            --ep-size 16 \
            --decode-context-parallel-size 16 \
            --disable-custom-all-reduce \
            --attention-backend trtllm_mla \
            --moe-runner-backend flashinfer_trtllm \
            --quantization modelopt_fp4 \
            --kv-cache-dtype fp8_e4m3 \
            --speculative-algorithm EAGLE3 \
            --speculative-draft-model-path /mnt/lustre_1000mbps/models/nvidia/Kimi-K3-Eagle3 \
            --speculative-num-steps 3 \
            --speculative-eagle-topk 1 \
            --speculative-num-draft-tokens 4 \
            --mem-fraction-static 0.84 \
            --max-running-requests 128 \
            --chunked-prefill-size 16384 \
            --enable-metrics \
            --enable-cache-report \
            --watchdog-timeout 3600
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib64:/usr/local/cuda/lib64
        - name: PYTHONNOUSERSITE
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8888
          name: http
        - containerPort: 29500
          name: dist
        - containerPort: 50051
          name: mooncake-rpc
        resources:
          requests:
            cpu: "64"
            memory: 1400Gi
            nvidia.com/gpu: "8"
          limits:
            nvidia.com/gpu: "8"
        volumeMounts:
        - name: library-dir-host
          mountPath: /usr/local/nvidia
        - name: gib
          mountPath: /usr/local/gib
        - name: dev-infiniband
          mountPath: /dev/infiniband
        - name: lustre-tier
          mountPath: /mnt/lustre_1000mbps
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: library-dir-host
        hostPath:
          path: /home/kubernetes/bin/nvidia
      - name: gib
        hostPath:
          path: /home/kubernetes/bin/gib
      - name: dev-infiniband
        hostPath:
          path: /dev/infiniband
          type: Directory
      - name: lustre-tier
        persistentVolumeClaim:
          claimName: lustre-1000mbps-pvc
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 512Gi
---
