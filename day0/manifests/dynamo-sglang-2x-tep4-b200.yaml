apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-sglang-w1
  namespace: ubench-llmd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamo-sglang-worker
      replica: w1
  template:
    metadata:
      annotations:
        gke-gcsfuse/cpu-limit: "32"
        gke-gcsfuse/ephemeral-storage-limit: 600Gi
        gke-gcsfuse/memory-limit: 64Gi
        gke-gcsfuse/volumes: "true"
      labels:
        app: dynamo-sglang-worker
        replica: w1
    spec:
      nodeSelector:
        kubernetes.io/hostname: gke-ikwak-reliabilit-a4-highgpu-8g-a4-0256e2f1-34t3
      serviceAccountName: workload-identity-k8s-sa
      tolerations:
      - operator: Exists
      containers:
      - name: sglang
        image: lmsysorg/sglang:nightly-dev-cu13-20260922-582389ce@sha256:0e1b14e302619a42ef5581b87db6804651d4f946301cf543d74a3a1eb1c33b40
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        env:
        - name: NCCL_NET_PLUGIN
          value: none
        - name: NCCL_TUNER_PLUGIN
          value: none
        - name: NCCL_PROFILER_PLUGIN
          value: none
        args:
        - |
          set -euo pipefail
          export PYTHONNOUSERSITE=1
          export PYTHONUNBUFFERED=1
          export SGLANG_TIMEOUT_KEEP_ALIVE=900
          export SGLANG_DEFAULT_THINKING=1
          export SGLANG_DSV41_REASONING_EFFORT=high
          export SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE=1
          export SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT=per_rank
          export SGLANG_SIMULATE_ACC_LEN=3.51
          export SGLANG_SIMULATE_ACC_METHOD=match-expected
          export SGLANG_SIMULATE_ACC_TOKEN_MODE=real-draft-token
          echo "Starting Dynamo SGLang Worker 1 (TP=4, EP=4, FP4, DSpark 5-tok, Engram Host Table)..."
          exec python3 -m sglang.launch_server \
            --model-path /gcs/deepseek-ai/DeepSeek-V4.1-Flash \
            --served-model-name deepseek-ai/DeepSeek-V4.1-Flash \
            --host 0.0.0.0 \
            --port 8888 \
            --trust-remote-code \
            --tensor-parallel-size 4 \
            --expert-parallel-size 4 \
            --mem-fraction-static 0.8 \
            --chunked-prefill-size 4096 \
            --swa-prefix-tails 4096 \
            --max-running-requests 128 \
            --prefill-decode-interval 16 \
            --speculative-algorithm DSPARK \
            --speculative-dspark-block-size 5 \
            --cuda-graph-max-bs-decode 64 \
            --reasoning-parser auto \
            --tool-call-parser auto \
            --watchdog-timeout 3600 \
            --enable-metrics \
            --enable-cache-report
        ports:
        - containerPort: 8888
          name: http
        resources:
          limits:
            nvidia.com/gpu: "4"
          requests:
            cpu: "64"
            memory: 700Gi
            nvidia.com/gpu: "4"
        volumeMounts:
        - mountPath: /gcs
          name: gcs-model
          readOnly: true
        - mountPath: /mnt/lustre_1000mbps
          name: lustre-tier
        - mountPath: /dev/shm
          name: dshm
      volumes:
      - name: gcs-model
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: ikwak-eu-stuff
            mountOptions: implicit-dirs,max-conns-per-host=0,file-cache:max-size-mb:-1,file-cache:cache-file-for-range-read:true,file-cache:enable-parallel-downloads:true,file-cache:max-parallel-downloads:32,file-cache:download-chunk-size-mb:64
      - name: lustre-tier
        persistentVolumeClaim:
          claimName: lustre-1000mbps-pvc
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Gi
---
