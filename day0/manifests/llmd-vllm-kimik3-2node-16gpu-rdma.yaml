apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmd-vllm-w1
  namespace: ubench-llmd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llmd-vllm-worker
      replica: w1
  template:
    metadata:
      annotations:
        networking.gke.io/default-interface: 'eth0'
        networking.gke.io/interfaces: |
          [
            {"interfaceName":"eth0","network":"default"},
            {"interfaceName":"eth1","network":"gvnic-1"},
            {"interfaceName":"eth2","network":"rdma-0"},
            {"interfaceName":"eth3","network":"rdma-1"},
            {"interfaceName":"eth4","network":"rdma-2"},
            {"interfaceName":"eth5","network":"rdma-3"},
            {"interfaceName":"eth6","network":"rdma-4"},
            {"interfaceName":"eth7","network":"rdma-5"},
            {"interfaceName":"eth8","network":"rdma-6"},
            {"interfaceName":"eth9","network":"rdma-7"}
          ]
      labels:
        app: llmd-vllm-worker
        replica: w1
    spec:
      nodeSelector:
        kubernetes.io/hostname: gke-ikwak-reliabilit-a4-highgpu-8g-a4-0256e2f1-34t3
      serviceAccountName: workload-identity-k8s-sa
      tolerations:
      - operator: Exists
      containers:
      - name: vllm
        image: vllm/vllm-openai:nightly-dev-x86_64-cu130-ac9126e58aa7
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          capabilities:
            add:
            - IPC_LOCK
            - SYS_RESOURCE
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          ulimit -l unlimited || true
          export PATH=/usr/local/gib/bin:$PATH
          export LD_LIBRARY_PATH=/usr/local/gib/lib64:/usr/local/nvidia/lib64:$LD_LIBRARY_PATH
          source /usr/local/gib/scripts/set_nccl_env.sh
          export NCCL_NET=IB
          export NCCL_NET_PLUGIN=none
          export NCCL_TUNER_PLUGIN=none
          export NCCL_PROFILER_PLUGIN=none
          export GLOO_SOCKET_IFNAME=eth0
          export NCCL_SOCKET_IFNAME=eth0
          export VLLM_HOST_IP=$(ip -4 -o addr show eth0 | awk '{print $4}' | cut -d/ -f1)
          export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
          export VLLM_ALLREDUCE_USE_FLASHINFER=0
          export VLLM_ALLREDUCE_USE_SYMM_MEM=0
          export VLLM_KIMI_K3_GEMM_AR=0
          export VLLM_ENABLE_GEMM_RS=0
          export VLLM_USE_DIRECT_DCP_A2A=0
          export VLLM_USE_DIRECT_DCP_Q_GATHER=0
          export VLLM_USE_DIRECT_DCP_KV_GATHER=0
          sed -i 's/_TOKENSPEED_MAX_Q_LEN = 8/_TOKENSPEED_MAX_Q_LEN = 16/g' /usr/local/lib/python3.12/dist-packages/vllm/v1/attention/backends/mla/tokenspeed_mla.py || true
          exec /usr/local/bin/vllm serve /mnt/lustre_1000mbps/models/RedHatAI/Kimi-K3-NVFP4 \
            --served-model-name moonshotai/Kimi-K3 \
            --host 0.0.0.0 \
            --port 8000 \
            --trust-remote-code \
            --language-model-only \
            --distributed-executor-backend mp \
            --nnodes 2 \
            --node-rank 0 \
            --master-addr $VLLM_HOST_IP \
            --master-port 29500 \
            --tensor-parallel-size 16 \
            --decode-context-parallel-size 16 \
            --enable-expert-parallel \
            --disable-custom-all-reduce \
            --attention-config '{"backend": "TOKENSPEED_MLA", "use_prefill_query_quantization": true, "mla_prefill_backend": "TRTLLM_RAGGED"}' \
            --speculative-config '{"method": "dspark", "model": "/mnt/lustre_1000mbps/models/RedHatAI/Kimi-K3-speculator.dspark", "num_speculative_tokens": 8, "draft_tensor_parallel_size": 16, "attention_backend": "FLASH_ATTN", "kv_cache_dtype": "bfloat16"}' \
            --moe-backend flashinfer_trtllm \
            --kv-cache-dtype fp8 \
            --gpu-memory-utilization 0.85 \
            --max-num-seqs 128 \
            --max-num-batched-tokens 8192 \
            --enable-prefix-caching \
            --enable-prompt-tokens-details
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib64:/usr/local/cuda/lib64
        - name: PYTHONNOUSERSITE
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 29500
          name: dist
        - containerPort: 50051
          name: mooncake-rpc
        resources:
          requests:
            cpu: "64"
            memory: 1400Gi
            nvidia.com/gpu: "8"
          limits:
            nvidia.com/gpu: "8"
        volumeMounts:
        - name: library-dir-host
          mountPath: /usr/local/nvidia
        - name: gib
          mountPath: /usr/local/gib
        - name: dev-infiniband
          mountPath: /dev/infiniband
        - name: lustre-tier
          mountPath: /mnt/lustre_1000mbps
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: library-dir-host
        hostPath:
          path: /home/kubernetes/bin/nvidia
      - name: gib
        hostPath:
          path: /home/kubernetes/bin/gib
      - name: dev-infiniband
        hostPath:
          path: /dev/infiniband
          type: Directory
      - name: lustre-tier
        persistentVolumeClaim:
          claimName: lustre-1000mbps-pvc
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 512Gi
---
